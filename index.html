<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소리소문 생존 - 설치 안내</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6DDC5">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preload" href="assets/fonts/GabiaGosran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<style>
  /* 이 페이지는 설치용 안내 화면입니다. 관람객에게는 보이지 않습니다. */
  body {
    position: static;
    min-height: 100%;
    background: var(--c-idle-bg);
    color: #1B1B1B;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow: auto;
    -webkit-user-select: text;
    user-select: text;
  }
  .wrap { width: 100%; max-width: 560px; }
  .wrap h1 { font-size: 34px; letter-spacing: -0.03em; margin-bottom: 6px; font-weight: 400; }
  .wrap .sub { font-size: 16px; opacity: 0.55; margin-bottom: 34px; line-height: 1.6; }
  .list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 34px; }
  .item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 24px;
    background: #fff;
    border: 3px solid var(--c-stroke);
    border-radius: 20px;
    color: inherit;
    text-decoration: none;
  }
  .item:active { transform: scale(0.99); }
  .item .txt { font-size: 17px; line-height: 1.45; letter-spacing: -0.02em; }
  .item .go { margin-left: auto; font-size: 15px; opacity: 0.4; flex: none; }
  .note { font-size: 15px; line-height: 1.9; opacity: 0.6; }
  .note b { font-weight: 400; opacity: 1; }
  .note ol { padding-left: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>소리소문 생존</h1>
  <p class="sub">아이패드 3대 설치용 안내 화면입니다.<br>각 기기에서 맡은 영상을 열고 홈 화면에 추가하세요.</p>

  <div class="list">
    <a class="item" href="c/">
      <span class="txt">차 소리에 묻히는<br>새소리</span>
      <span class="go">열기 →</span>
    </a>
    <a class="item" href="a/">
      <span class="txt">풀벌레 소리 대신 들리는<br>사라짐의 소리</span>
      <span class="go">열기 →</span>
    </a>
    <a class="item" href="b/">
      <span class="txt">짝을 부르는 소리에<br>다가오는 건 사냥꾼</span>
      <span class="go">열기 →</span>
    </a>
  </div>

  <div class="note">
    <b>설치 순서</b>
    <ol>
      <li>위에서 해당 영상을 연다</li>
      <li>사파리 공유 버튼 → 홈 화면에 추가</li>
      <li>설정 → 디스플레이 및 밝기 → 자동 잠금 → 안 함</li>
      <li>제어 센터에서 무음 해제, 볼륨 확인</li>
      <li>홈 화면 아이콘으로 실행 → 가이드 접근 시작</li>
    </ol>
  </div>
</div>
</body>
</html>
